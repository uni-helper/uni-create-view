name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: true

      - run: vpx @vscode/vsce publish --oidc

      - run: vpx ovsx@1.2.0 publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - run: vpx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
