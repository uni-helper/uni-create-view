name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: true

      # 发布工具不再是 devDependencies，vpx 每次从 registry 拉取，必须显式锁版本
      - run: vpx @vscode/vsce@3.9.2 publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - run: vpx ovsx@1.2.0 publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - run: vpx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
